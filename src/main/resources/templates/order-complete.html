<!doctype html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#f4f5f1">
    <title>Order received | Forma Electronics</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/css/app.css">
</head>
<body>
<div th:replace="~{fragments/header :: siteHeader}"></div>
<main class="page-wrap inner-page success-page">
    <div class="success-mark"><i data-lucide="check" aria-hidden="true"></i></div>
    <p class="eyebrow"><span class="eyebrow-line"></span> THAT’S A WRAP</p>
    <h1>Thanks<span>, <span th:text="${customerName}">friend</span>.</span></h1>
    <p class="success-copy">Your demo order is in. We’ve set aside your picks and sent the details to <strong th:text="${#strings.defaultString(customerEmail, 'your inbox')}">your inbox</strong>.</p>
    <div class="order-reference"><span>DEMO ORDER</span><strong th:text="${orderReference}">A1B2C3D4</strong><span>Total: $<span th:text="${orderTotal}">249.00</span></span></div>
    <p class="demo-note">This is a sample storefront. No payment was taken and no shipment was created.</p>
    <a class="button button-dark" th:href="@{/}">Back to the collection <i data-lucide="arrow-right" aria-hidden="true"></i></a>
</main>
<div th:replace="~{fragments/footer :: siteFooter}"></div>
</body>
</html>
